[pytest]
asyncio_mode = auto

# pytest-env 1.x uses an `env =` key inside the [pytest] section.
# The old `[pytest:env]` section format silently no-ops on 1.x, leaving
# Settings() to fail in CI on missing required fields.
env =
    SUPABASE_URL=https://fake.supabase.co
    SUPABASE_ANON_KEY=fake-anon-key
    SUPABASE_SERVICE_ROLE_KEY=fake-service-key
    FINNHUB_API_KEY=fake-finnhub-key
    MISTRAL_API_KEY=fake-mistral-key
    CEREBRAS_API_KEY=fake-cerebras-key
    GROQ_API_KEY=fake-groq-key
